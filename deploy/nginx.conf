# CodeRace reverse proxy: HTTPS termination + WebSocket upgrade.
#
# Replace typing.example.com and CONTAINER_IP:CONTAINER_PORT with your own values;
# the real backend address is deliberately not committed.
#
# The `map` MUST live in the http{} block (e.g. /etc/nginx/conf.d/upgrade.conf
# or straight into nginx.conf), not inside a server{} block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name typing.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name typing.example.com;

    ssl_certificate /srv/server_certs/typing.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/typing.example.com/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # Profile images are capped at 512 KB server-side; leave headroom.
    client_max_body_size 2m;

    location / {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        # WebSocket upgrade (/ws/{code}) - without these the socket 400s.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells the app the original scheme, so it marks its cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Races and idle lobbies hold the socket open for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }
}

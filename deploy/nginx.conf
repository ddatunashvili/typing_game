# CodeRace reverse proxy - one self-contained vhost per domain.
#
# Replace coderace.example.com / typing.example.com and CONTAINER_IP:CONTAINER_PORT
# with your own values; the real backend address is deliberately not committed.
#
# WHY THERE IS NO `map` BLOCK
# ---------------------------
# The usual recipe is `map $http_upgrade $connection_upgrade` at http{} level. That
# is fine when you own nginx.conf, but a hosting panel that only lets you edit a
# vhost file cannot take a `map` - it is invalid outside http{} and the whole file
# is rejected. So instead the WebSocket path gets its own location block with
# `Connection "upgrade"` written in literally. Only /ws/ needs upgrading, so
# nothing else is affected, and each file below pastes in on its own.
#
# WHAT GOES WRONG WITHOUT IT
# --------------------------
# Drop the three proxy_http_version / Upgrade / Connection lines and the handshake
# arrives at the app as an ordinary GET. A websocket route does not match a plain
# GET, so FastAPI answers 404 and multiplayer silently never connects. That is the
# "Unexpected response code: 404" you see in the browser console.


# ============================== coderace ==============================
server {
    listen 80;
    server_name coderace.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25.1: use `listen 443 ssl http2;`
    server_name coderace.example.com;

    ssl_certificate     /srv/server_certs/coderace.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/coderace.example.com/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # Avatars are capped at 512 KB server-side; leave headroom for the upload.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- the websocket. This block is the whole fix. ----
    location /ws/ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A lobby holds its socket open while players sit and wait.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Icons and the social card change only on a redeploy: cache them hard.
    location ~* ^/static/.*\.(png|ico|svg|webp|jpg|jpeg)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # app.js / style.css carry a ?v= build stamp, but revalidate anyway so a
    # stale copy can never pair with newer markup.
    location ~* ^/static/.*\.(css|js)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
    }

    # Bot portraits and player avatars are stable; the app sets a long max-age.
    location ~* ^/api/(bot-avatar|bot-card|avatar)/ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location = /robots.txt            { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /sitemap.xml           { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /manifest.webmanifest  { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }

    location / {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells the app the original scheme, so it marks its cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }
}


# =============================== typing ===============================
# Identical to the block above. Both domains serve the same app, so the only
# differences are server_name and the certificate paths.
#
# SEO note: two hostnames serving identical pages split your ranking, and the
# app advertises a single canonical URL from SITE_URL. If you would rather have
# one address, replace this whole server block with the redirect at the bottom.
server {
    listen 80;
    server_name typing.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name typing.example.com;

    ssl_certificate     /srv/server_certs/typing.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/typing.example.com/key.pem;

# CodeRace reverse proxy: HTTPS termination, WebSocket upgrade, static caching.
#
# Replace typing.example.com and CONTAINER_IP:CONTAINER_PORT with your own values;
# the real backend address is deliberately not committed.
#
# The `map` MUST live in the http{} block (e.g. /etc/nginx/conf.d/upgrade.conf
# or straight into nginx.conf), not inside a server{} block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Every domain the app answers on must be listed here AND must carry the
# WebSocket headers below. A vhost that proxies HTTP but drops Upgrade turns
# /ws/{code} into a plain GET, which a websocket route does not match - nginx
# then hands back 404 and multiplayer silently never connects.
server {
    listen 80;
    server_name coderace.example.com typing.example.com;
    return 301 https://$host$request_uri;
}

# Optional: keep one canonical hostname for SEO. Identical content on two
# domains splits your ranking, so redirect the spare one.
#server {
#    listen 443 ssl http2;
#    server_name typing.example.com;
#    ssl_certificate     /srv/server_certs/typing.example.com/cert.pem;
#    ssl_certificate_key /srv/server_certs/typing.example.com/key.pem;
#    return 301 https://coderace.example.com$request_uri;
#}

server {
    listen 443 ssl http2;
    # nginx >= 1.25.1 deprecates the line above; there it is:
    #   listen 443 ssl;
    #   http2 on;
    server_name coderace.example.com typing.example.com;

    ssl_certificate /srv/server_certs/coderace.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/coderace.example.com/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # Profile images are capped at 512 KB server-side; leave headroom.
    client_max_body_size 2m;

    # Compress what benefits from it. Images and the OG png are already packed.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Icons and the social card change only on a redeploy: cache them hard.
    location ~* ^/static/.*\.(png|ico|svg|webp|jpg|jpeg)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app's own css/js is unhashed, so a long cache would serve stale code
    # after a deploy. Revalidate every time and let ETag do the work.
    location ~* ^/static/.*\.(css|js)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Generated bot faces are deterministic; the app already sets a long max-age.
    location /api/bot-avatar/ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location = /robots.txt      { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /sitemap.xml     { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /manifest.webmanifest { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }

    location / {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        # WebSocket upgrade (/ws/{code}) - without these the socket 400s.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells the app the original scheme, so it marks its cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Races and idle lobbies hold the socket open for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }
}

# CodeRace vhost - SECOND domain folded into the primary one.
#
# Use this INSTEAD of nginx-typing.conf when you want a single canonical
# address. Everything 301s to the primary domain, which keeps search engines
# from splitting your ranking across two identical sites, and matches the
# canonical URL the app advertises from SITE_URL.
#
# Replace before use:
#   typing.example.com     the domain being retired
#   coderace.example.com   the domain to land on
#
# The ACME location stays so the certificate for the redirected domain can
# still be renewed.

server {
    listen 80;
    server_name typing.example.com;
    return 301 https://coderace.example.com$request_uri;
}

server {
    # `listen ... http2` works on every nginx. On 1.25.1+ this logs a deprecation
    # notice; if you are on that or newer you may swap it for:
    #     listen 443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    server_name typing.example.com;

    ssl_certificate     /srv/server_certs/typing.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/typing.example.com/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }

    location / {
        return 301 https://coderace.example.com$request_uri;
    }
}

# CodeRace vhost - PRIMARY domain (the canonical one, matching SITE_URL).
#
# Replace before use:
#   coderace.example.com        your domain
#   CONTAINER_IP:CONTAINER_PORT your panel's container address and port
#
# This file is self-contained: paste it in as one vhost, nothing needs adding to
# http{} or nginx.conf. `nginx -t` then reload.
#
# There is deliberately no `map $http_upgrade` block. `map` is only valid at
# http{} level, so a panel that edits a single vhost file rejects the whole
# config. `location /ws/` writes Connection "upgrade" literally instead, which
# needs no http{} changes and touches only that one path.
#
# Remove the /ws/ block and the websocket handshake reaches the app as an
# ordinary GET. A websocket route does not match a plain GET, so the app
# answers 404 and multiplayer silently never connects.

server {
    listen 80;
    server_name coderace.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` works on every nginx. On 1.25.1+ this logs a deprecation
    # notice; if you are on that or newer you may swap it for:
    #     listen 443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    server_name coderace.example.com;

    ssl_certificate     /srv/server_certs/coderace.example.com/cert.pem;
    ssl_certificate_key /srv/server_certs/coderace.example.com/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # Avatars are capped at 512 KB server-side; leave headroom for the upload.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- the websocket: this block is what makes multiplayer work ----
    location /ws/ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A lobby holds its socket open while players sit and wait.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Icons and the social card change only on a redeploy: cache them hard.
    location ~* ^/static/.*\.(png|ico|svg|webp|jpg|jpeg)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # app.js / style.css carry a ?v= build stamp, but revalidate anyway so a
    # stale copy can never pair with newer markup.
    location ~* ^/static/.*\.(css|js)$ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
    }

    # Bot portraits and player avatars are stable; the app sets a long max-age.
    location ~* ^/api/(bot-avatar|bot-card|avatar)/ {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location = /robots.txt            { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /sitemap.xml           { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }
    location = /manifest.webmanifest  { proxy_pass http://CONTAINER_IP:CONTAINER_PORT; expires 1h; }

    location / {
        proxy_pass http://CONTAINER_IP:CONTAINER_PORT;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells the app the original scheme, so it marks its cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }
}
